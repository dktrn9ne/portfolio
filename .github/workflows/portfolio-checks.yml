name: Portfolio portrait checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          npm run test:browser
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-browser-evidence
          path: test-results/portrait/
